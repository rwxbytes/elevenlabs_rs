[package]
name = "speech_engine_ollama"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.1", features = ["ws"] }
elevenlabs_rs = { path = "../../elevenlabs_rs", default-features = false, features = [
  "genai",
  "native-tls",
  "ws",
] }
rig-core = "0.39.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
