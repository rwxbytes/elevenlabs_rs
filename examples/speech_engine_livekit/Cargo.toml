[package]
name = "speech_engine_livekit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.1", features = ["ws"] }
base64 = "0.22.1"
cpal = "0.15.3"
eframe = { version = "0.32.3", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
elevenlabs_rs = { path = "../../elevenlabs_rs", default-features = false, features = [
  "convai",
  "genai",
  "native-tls",
  "ws",
] }
futures-util = "0.3.30"
livekit = { version = "=0.7.47", features = ["native-tls"] }
livekit-api = { version = "=0.5.2", default-features = false, features = ["access-token"] }
livekit-protocol = "=0.7.8"
libwebrtc = "=0.3.37"
reqwest = { version = "0.12", features = ["json"] }
rig-core = "0.39.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.17"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
webrtc-sys = "=0.3.35"
